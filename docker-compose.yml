services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-infonet}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-infonet}
      POSTGRES_DB: ${POSTGRES_DB:-infonet}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    # ports:
    #   - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "PGPASSWORD=$$POSTGRES_PASSWORD psql -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB -tAc 'SELECT 1' | grep -qx 1"]
      interval: 5s
      timeout: 5s
      retries: 20
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data


  litellm-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${LITELLM_DB_USER:-litellm}
      POSTGRES_PASSWORD: ${LITELLM_DB_PASSWORD:?Set LITELLM_DB_PASSWORD in .env}
      POSTGRES_DB: ${LITELLM_DB_NAME:-litellm}
    volumes:
      - litellm-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "PGPASSWORD=$$POSTGRES_PASSWORD psql -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB -tAc 'SELECT 1' | grep -qx 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  vllm:
    image: ${VLLM_IMAGE:-vllm/vllm-openai:latest}
    profiles: ["gpu"]
    restart: unless-stopped
    ipc: host
    environment:
      HUGGING_FACE_HUB_TOKEN: ${HUGGING_FACE_HUB_TOKEN:-}
    command: >-
      --model ${LOCAL_MODEL_ID:-Qwen/Qwen3-8B}
      --served-model-name ${LOCAL_MODEL_ID:-Qwen/Qwen3-8B}
      --host 0.0.0.0
      --port 8000
      --api-key ${VLLM_API_KEY:-local-vllm-key}
      --dtype auto
      --max-model-len ${LOCAL_MAX_MODEL_LEN:-16384}
      --gpu-memory-utilization ${VLLM_GPU_MEMORY_UTILIZATION:-0.90}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    volumes:
      - huggingface-cache:/root/.cache/huggingface
    ports:
      - "127.0.0.1:8001:8000"

  ollama:
    image: ${OLLAMA_IMAGE:-ollama/ollama:latest}
    profiles: ["ollama"]
    restart: unless-stopped
    environment:
      OLLAMA_KEEP_ALIVE: "-1"
      OLLAMA_MAX_LOADED_MODELS: "2"
    volumes:
      - ollama-data:/root/.ollama
    ports:
      - "127.0.0.1:11434:11434"
    gpus:
    - driver: nvidia
      count: all

  ollama-init:
    image: ${OLLAMA_IMAGE:-ollama/ollama:latest}
    profiles: ["ollama"]
    depends_on:
      ollama:
        condition: service_started
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_ROUTER_MODEL_ID: ${OLLAMA_ROUTER_MODEL_ID:-qwen3:0.6b}
      OLLAMA_MODEL_ID: ${OLLAMA_MODEL_ID:-qwen3:4b-instruct-2507-q4_K_M}
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -eu
        attempt=0
        until ollama list >/dev/null 2>&1; do
          attempt=$$((attempt + 1))
          if [ "$$attempt" -ge 60 ]; then
            echo "ERROR: Ollama did not become ready after 60 attempts." >&2
            exit 1
          fi
          echo "Waiting for Ollama... attempt $$attempt/60"
          sleep 2
        done
        echo "Pulling router model: $${OLLAMA_ROUTER_MODEL_ID}"
        ollama pull "$${OLLAMA_ROUTER_MODEL_ID}"
        echo "Pulling answer model: $${OLLAMA_MODEL_ID}"
        ollama pull "$${OLLAMA_MODEL_ID}"
        ollama show "$${OLLAMA_ROUTER_MODEL_ID}" >/dev/null
        ollama show "$${OLLAMA_MODEL_ID}" >/dev/null
        echo "Ollama models are downloaded."
    restart: "no"
  litellm:
    image: ${LITELLM_IMAGE:-ghcr.io/berriai/litellm-database:v1.97.0}
    restart: unless-stopped
    entrypoint:
      - /bin/sh
      - -c
    command:
      - |
        if [ "$${LOCAL_BACKEND}" = "ollama" ]; then
          python /config/ollama_startup_gate.py
        fi
        python /config/render_config.py &&
        exec litellm --config /tmp/litellm-config.yaml --host 0.0.0.0 --port 4000 --num_workers ${LITELLM_WORKERS:-1}
    environment:
      DATABASE_URL: postgresql://${LITELLM_DB_USER:-litellm}:${LITELLM_DB_PASSWORD:?Set LITELLM_DB_PASSWORD in .env}@litellm-db:5432/${LITELLM_DB_NAME:-litellm}
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-change-me}
      LITELLM_SALT_KEY: ${LITELLM_SALT_KEY:-sk-change-this-once-and-never-rotate}
      LITELLM_ROUTING_STRATEGY: ${LITELLM_ROUTING_STRATEGY:-least-busy}
      LITELLM_NUM_RETRIES: ${LITELLM_NUM_RETRIES:-0}
      LITELLM_REQUEST_TIMEOUT: ${LITELLM_REQUEST_TIMEOUT:-240}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""

      LOCAL_BACKEND: ${LOCAL_BACKEND:-vllm}
      LOCAL_MODEL_ID: ${LOCAL_MODEL_ID:-Qwen/Qwen3-8B}
      LOCAL_MODEL_EXTRA_JSON: ${LOCAL_MODEL_EXTRA_JSON:-}
      VLLM_API_BASE: ${VLLM_API_BASE:-http://vllm:8000/v1}
      VLLM_API_KEY: ${VLLM_API_KEY:-local-vllm-key}
      OLLAMA_ROUTER_MODEL_ID: ${OLLAMA_ROUTER_MODEL_ID:-qwen3:0.6b}
      OLLAMA_MODEL_ID: ${OLLAMA_MODEL_ID:-qwen3:4b-instruct-2507-q4_K_M}
      OLLAMA_API_BASE: ${OLLAMA_API_BASE:-http://ollama:11434}
      OLLAMA_STARTUP_TIMEOUT_SECONDS: ${OLLAMA_STARTUP_TIMEOUT_SECONDS:-1800}
      OLLAMA_PRELOAD_TIMEOUT_SECONDS: ${OLLAMA_PRELOAD_TIMEOUT_SECONDS:-300}
      ALLOW_LOCAL_MODEL_FALLBACK: ${ALLOW_LOCAL_MODEL_FALLBACK:-false}
      ALLOW_REMOTE_ROUTER_FALLBACK: ${ALLOW_REMOTE_ROUTER_FALLBACK:-false}

      CLOUD_SMALL_MODEL: ${CLOUD_SMALL_MODEL:-openai/gpt-5-mini}
      CLOUD_SMALL_API_KEY: ${CLOUD_SMALL_API_KEY:-}
      CLOUD_SMALL_API_BASE: ${CLOUD_SMALL_API_BASE:-}
      CLOUD_SMALL_EXTRA_JSON: ${CLOUD_SMALL_EXTRA_JSON:-}
      CLOUD_LARGE_MODEL: ${CLOUD_LARGE_MODEL:-openai/gpt-5}
      CLOUD_LARGE_API_KEY: ${CLOUD_LARGE_API_KEY:-}
      CLOUD_LARGE_API_BASE: ${CLOUD_LARGE_API_BASE:-}
      CLOUD_LARGE_EXTRA_JSON: ${CLOUD_LARGE_EXTRA_JSON:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-openai/text-embedding-3-small}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_API_BASE: ${EMBEDDING_API_BASE:-}
      EMBEDDING_EXTRA_JSON: ${EMBEDDING_EXTRA_JSON:-}

      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_HOST: ${LANGFUSE_HOST:-}
    volumes:
      - ./infra/litellm/render_config.py:/config/render_config.py:ro
      - ./infra/litellm/ollama_startup_gate.py:/config/ollama_startup_gate.py:ro
    depends_on:
      litellm-db:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4000/health/readiness', timeout=5)"]
      interval: 10s
      timeout: 6s
      retries: 30
      start_period: ${LITELLM_START_PERIOD:-20m}
    # ports:
    #   - "127.0.0.1:4000:4000"
  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      APP_NAME: ${APP_NAME:-Infonet AI Router}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DATABASE_URL: postgresql://${POSTGRES_USER:-infonet}:${POSTGRES_PASSWORD:-infonet}@postgres:5432/${POSTGRES_DB:-infonet}
      LITELLM_BASE_URL: http://litellm:4000
      LITELLM_DEFAULT_API_KEY: ${BACKEND_LITELLM_KEY:-sk-change-me}
      LITELLM_KEYS_JSON: ${LITELLM_KEYS_JSON:-}
      LOCAL_ROUTER_MODEL_ALIAS: local-router
      LOCAL_ROUTER_MAX_TOKENS: ${LOCAL_ROUTER_MAX_TOKENS:-64}
      LOCAL_ROUTER_MIN_CONFIDENCE: ${LOCAL_ROUTER_MIN_CONFIDENCE:-0.55}
      LOCAL_ROUTER_FALLBACK_TIER: ${LOCAL_ROUTER_FALLBACK_TIER:-cloud-small}
      LOCAL_FAST_MIN_CONFIDENCE: ${LOCAL_FAST_MIN_CONFIDENCE:-0.85}
      LOCAL_FAST_MAX_TOKENS: ${LOCAL_FAST_MAX_TOKENS:-512}
      EMBEDDING_MODEL_ALIAS: embedding
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-1536}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-240}
      GIST_REGULATIONS_INDEX_DIR: ${GIST_REGULATIONS_INDEX_DIR:-/app/jireumgil_index}
      GIST_REGULATIONS_TOP_K: ${GIST_REGULATIONS_TOP_K:-5}
      GIST_REGULATIONS_VECTOR_DIMENSIONS: ${GIST_REGULATIONS_VECTOR_DIMENSIONS:-1536}
      GIST_REGULATIONS_CONTEXT_CHARS: ${GIST_REGULATIONS_CONTEXT_CHARS:-16000}
      PDF_DOCUMENT_CONTEXT_CHARS: ${PDF_DOCUMENT_CONTEXT_CHARS:-48000}
      WEB_SEARCH_MAX_RESULTS: ${WEB_SEARCH_MAX_RESULTS:-5}
      WEB_SEARCH_TIMEOUT_SECONDS: ${WEB_SEARCH_TIMEOUT_SECONDS:-12}
      WEB_SEARCH_REGION: ${WEB_SEARCH_REGION:-us-en}
      WEB_SEARCH_SAFESEARCH: ${WEB_SEARCH_SAFESEARCH:-moderate}
      WEB_SEARCH_BACKEND: ${WEB_SEARCH_BACKEND:-duckduckgo}
      WEB_SEARCH_PROXY: ${WEB_SEARCH_PROXY:-}
      WEB_SEARCH_QUERY_CHARS: ${WEB_SEARCH_QUERY_CHARS:-1000}
      WEB_SEARCH_SNIPPET_CHARS: ${WEB_SEARCH_SNIPPET_CHARS:-1200}
      WEB_SEARCH_CONTEXT_CHARS: ${WEB_SEARCH_CONTEXT_CHARS:-12000}
      WEB_SEARCH_AUTO_REGION: ${WEB_SEARCH_AUTO_REGION:-true}
      WEB_SEARCH_FETCH_PAGES: ${WEB_SEARCH_FETCH_PAGES:-true}
      WEB_SEARCH_FETCH_MAX_PAGES: ${WEB_SEARCH_FETCH_MAX_PAGES:-4}
      WEB_SEARCH_FETCH_CONCURRENCY: ${WEB_SEARCH_FETCH_CONCURRENCY:-3}
      WEB_SEARCH_FETCH_TIMEOUT_SECONDS: ${WEB_SEARCH_FETCH_TIMEOUT_SECONDS:-8}
      WEB_SEARCH_FETCH_MAX_BYTES: ${WEB_SEARCH_FETCH_MAX_BYTES:-1000000}
      WEB_SEARCH_FETCH_MAX_REDIRECTS: ${WEB_SEARCH_FETCH_MAX_REDIRECTS:-3}
      WEB_SEARCH_PAGE_CHARS: ${WEB_SEARCH_PAGE_CHARS:-6500}
      CONVERSATION_HISTORY_MESSAGES: ${CONVERSATION_HISTORY_MESSAGES:-16}
      CONVERSATION_HISTORY_CHARS: ${CONVERSATION_HISTORY_CHARS:-24000}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}

      AUTH_MODE: ${AUTH_MODE:-openwebui}
      OPENWEBUI_BACKEND_KEY: ${OPENWEBUI_BACKEND_KEY:-sk-openwebui-change-me}
      OPENWEBUI_IDENTITY_JWT_SECRET: ${OPENWEBUI_IDENTITY_JWT_SECRET:-change-this-openwebui-identity-secret}
      OPENWEBUI_IDENTITY_JWT_HEADER: X-OpenWebUI-User-Jwt
      OPENWEBUI_DEFAULT_TEAM_ID: ${OPENWEBUI_DEFAULT_TEAM_ID:-lab}
      LAB_ADMIN_API_KEY: ${LAB_ADMIN_API_KEY:-}
      AUTH_TOKEN_HEADER: ${AUTH_TOKEN_HEADER:-Cf-Access-Jwt-Assertion}
      OIDC_JWKS_URL: ${OIDC_JWKS_URL:-}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:-}
      OIDC_USER_ID_CLAIM: ${OIDC_USER_ID_CLAIM:-sub}
      OIDC_EMAIL_CLAIM: ${OIDC_EMAIL_CLAIM:-email}
      OIDC_NAME_CLAIM: ${OIDC_NAME_CLAIM:-name}
      OIDC_ROLES_CLAIM: ${OIDC_ROLES_CLAIM:-roles}
      OIDC_TEAM_CLAIM: ${OIDC_TEAM_CLAIM:-team_id}

    depends_on:
      postgres:
        condition: service_healthy
      litellm:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=5)"]
      interval: 10s
      timeout: 6s
      retries: 20
      start_period: 20s
    volumes:
      - ./jireumgil_index:/app/jireumgil_index:ro
    ports:
      - "127.0.0.1:8000:8000"

  open-webui:
    build:
      context: ./infra/open-webui
      args:
        OPENWEBUI_BASE_IMAGE: ${OPENWEBUI_IMAGE:-ghcr.io/open-webui/open-webui:v0.11.0}
        OPENWEBUI_SOURCE_REF: ${OPENWEBUI_SOURCE_REF:-v0.11.0}
    image: ${OPENWEBUI_CUSTOM_IMAGE:-lv-router-open-webui:v0.11.0-ordered-suggestions}
    restart: unless-stopped
    environment:
      WEBUI_NAME: ${WEBUI_NAME:-Infonet AI Router}
      WEBUI_SECRET_KEY: ${OPENWEBUI_SECRET_KEY:-change-this-openwebui-session-secret}
      WEBUI_AUTH: "true"
      ENABLE_SIGNUP: ${OPENWEBUI_ENABLE_SIGNUP:-true}
      DEFAULT_USER_ROLE: user
      ENABLE_PERSISTENT_CONFIG: "false"
      ENABLE_OLLAMA_API: "false"
      ENABLE_OPENAI_API: "true"
      OPENAI_API_BASE_URL: http://backend:8000/v1
      OPENAI_API_KEY: ${OPENWEBUI_BACKEND_KEY:-sk-openwebui-change-me}
      OPENAI_API_CONFIGS: >-
        {"0":{"enable":true,"connection_type":"local","model_ids":["auto","direct","web-search","pdf-document","gist-regulations","research-paper"]}}
      DEFAULT_MODELS: "auto"
      DEFAULT_PROMPT_SUGGESTIONS: >-
        [{"title":["지도학습과 비지도학습의 차이를 쉽게 설명해줘.","Direct"],"content":"지도학습과 비지도학습의 차이를 쉽게 설명해줘."},{"title":["최근 공개된 주요 AI 모델은 무엇이고, 이전 모델과 비교해 무엇이 달라졌는지 최신 출처와 함께 알려줘.","Web Search"],"content":"최근 공개된 주요 AI 모델은 무엇이고, 이전 모델과 비교해 무엇이 달라졌는지 최신 출처와 함께 알려줘."},{"title":["업로드한 PDF의 핵심 주장과 근거, 그리고 한계를 정리해줘.","PDF Document · PDF 업로드 필요"],"content":"업로드한 PDF의 핵심 주장과 근거, 그리고 한계를 정리해줘."},{"title":["GIST 규정에 따르면 석사과정 학생의 졸업 요건은 무엇이야?","GIST Regulations"],"content":"GIST 규정에 따르면 석사과정 학생의 졸업 요건은 무엇이야?"}]
      DEFAULT_MODEL_METADATA: >-
        {"capabilities":{"file_upload":true,"file_context":true,"vision":false,"web_search":false,"image_generation":false,"code_interpreter":false,"citations":true,"status_updates":true,"builtin_tools":false}}
      MODEL_ORDER_LIST: '["auto","direct","web-search","pdf-document","gist-regulations","research-paper"]'
      TASK_MODEL: "direct"
      TASK_MODEL_EXTERNAL: "direct"
      USER_PERMISSIONS_CHAT_FILE_UPLOAD: "true"
      RAG_ALLOWED_FILE_EXTENSIONS: pdf
      RAG_FILE_MAX_SIZE: ${PDF_UPLOAD_MAX_MB:-25}
      RAG_FILE_MAX_COUNT: ${PDF_UPLOAD_MAX_COUNT:-4}
      RAG_EMBEDDING_ENGINE: openai
      RAG_EMBEDDING_MODEL: embedding
      RAG_OPENAI_API_BASE_URL: http://litellm:4000/v1
      RAG_OPENAI_API_KEY: ${BACKEND_LITELLM_KEY:-sk-change-me}
      RAG_EMBEDDING_BATCH_SIZE: "1"
      RAG_TOP_K: ${PDF_RAG_TOP_K:-6}
      RAG_SYSTEM_CONTEXT: "true"
      ENABLE_RETRIEVAL_QUERY_GENERATION: "false"
      RAG_FULL_CONTEXT: "false"
      ENABLE_RAG_HYBRID_SEARCH: "false"
      USER_PERMISSIONS_CHAT_WEB_UPLOAD: "false"
      ENABLE_WEB_SEARCH: "false"
      USER_PERMISSIONS_FEATURES_WEB_SEARCH: "false"
      WEBUI_BANNERS: >-
        [{"id":"infonet-coming-soon","type":"info","title":"Workflows","content":"<b>Available:</b> Auto · Direct · Web Search · Uploaded PDF · GIST Regulations · Research Paper Drafting &nbsp;&nbsp; <span style=\"opacity:0.45\">Grant — coming soon · Website — coming soon</span>","dismissible":false,"timestamp":1787389200}]
      ENABLE_NOTES: "false"
      ENABLE_CALENDAR: "false"
      ENABLE_AUTOMATIONS: "false"
      ENABLE_SUBAGENTS: "false"
      ENABLE_TITLE_GENERATION: "false"
      ENABLE_TAGS_GENERATION: "false"
      ENABLE_FOLLOW_UP_GENERATION: "false"
      ENABLE_AUTOCOMPLETE_GENERATION: "false"
      ENABLE_EVALUATION_ARENA_MODELS: "false"
      ENABLE_COMMUNITY_SHARING: "false"
      ENABLE_BASE_MODELS_CACHE: "true"
      MODELS_CACHE_TTL: "300"
      ENABLE_FORWARD_USER_INFO_HEADERS: "true"
      FORWARD_USER_INFO_HEADER_JWT_SECRET: ${OPENWEBUI_IDENTITY_JWT_SECRET:-change-this-openwebui-identity-secret}
      FORWARD_USER_INFO_HEADER_JWT: X-OpenWebUI-User-Jwt
      ENABLE_DIRECT_CONNECTIONS: "false"
    volumes:
      - open-webui-data:/app/backend/data
      - ./jireumgil_index/pdfs:/app/backend/open_webui/static/gist-regulations:ro
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:8080"

volumes:
  litellm-postgres-data:
  postgres-data:
  redis-data:
  huggingface-cache:
  ollama-data:
  open-webui-data:
